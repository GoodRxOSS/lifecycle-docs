<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title description">
  <title id="title">Lifecycle request-to-Environment flow</title>
  <desc id="description">GitHub, user clients, and the identity provider send requests to Lifecycle web and API services. Redis sends queued work to Lifecycle workers. Web and worker services use Postgres. Workers use object storage and run builds, Kubernetes workloads, and Site delivery. Lifecycle returns status, logs, and URLs to clients.</desc>
  <defs>
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f4d400"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8d8a82"/>
    </marker>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.24"/>
    </filter>
    <style>
      .group { fill: #12110f; stroke: #302e29; stroke-width: 2; }
      .box { fill: #1b1916; stroke: #49463e; stroke-width: 2; }
      .box-accent { fill: #201d12; stroke: #f4d400; stroke-width: 2; }
      .group-title { fill: #aaa69c; font: 600 16px Inter, ui-sans-serif, system-ui, sans-serif; letter-spacing: 2px; }
      .label { fill: #f7f5ef; font: 650 20px Inter, ui-sans-serif, system-ui, sans-serif; }
      .sub { fill: #b8b4aa; font: 400 15px Inter, ui-sans-serif, system-ui, sans-serif; }
      .result-label { fill: #f4d400; font: 650 20px Inter, ui-sans-serif, system-ui, sans-serif; }
      .result-sub { fill: #d2cec4; font: 400 16px Inter, ui-sans-serif, system-ui, sans-serif; }
      .line-gold { fill: none; stroke: #f4d400; stroke-width: 3; marker-end: url(#arrow-gold); }
      .line-muted { fill: none; stroke: #8d8a82; stroke-width: 2.5; marker-end: url(#arrow-muted); }
      .line-bidirectional { fill: none; stroke: #8d8a82; stroke-width: 2.5; marker-start: url(#arrow-muted); marker-end: url(#arrow-muted); }
    </style>
  </defs>

  <rect width="1280" height="720" rx="24" fill="#0c0b0a"/>

  <rect class="group" x="30" y="42" width="260" height="535" rx="20"/>
  <rect class="group" x="320" y="42" width="560" height="535" rx="20"/>
  <rect class="group" x="910" y="42" width="340" height="535" rx="20"/>

  <text class="group-title" x="58" y="82">REQUESTS</text>
  <text class="group-title" x="348" y="82">LIFECYCLE CONTROL PLANE</text>
  <text class="group-title" x="938" y="82">WORK AND DELIVERY</text>

  <g filter="url(#soft-shadow)">
    <rect class="box" x="58" y="110" width="204" height="80" rx="14"/>
    <text class="label" x="82" y="143">GitHub</text>
    <text class="sub" x="82" y="168">Repository events</text>

    <rect class="box-accent" x="58" y="244" width="204" height="92" rx="14"/>
    <text class="label" x="82" y="278">User clients</text>
    <text class="sub" x="82" y="304">UI · CLI · API · MCP</text>

    <rect class="box" x="58" y="390" width="204" height="80" rx="14"/>
    <text class="label" x="82" y="423">Identity provider</text>
    <text class="sub" x="82" y="448">Interactive sign-in</text>

    <rect class="box-accent" x="370" y="110" width="220" height="86" rx="14"/>
    <text class="label" x="394" y="145">Web and API</text>
    <text class="sub" x="394" y="171">Authenticate and accept work</text>

    <rect class="box" x="620" y="110" width="210" height="86" rx="14"/>
    <text class="label" x="644" y="145">Redis</text>
    <text class="sub" x="644" y="171">Queued work</text>

    <rect class="box-accent" x="620" y="248" width="210" height="86" rx="14"/>
    <text class="label" x="644" y="283">Workers</text>
    <text class="sub" x="644" y="309">Build, deploy, and clean up</text>

    <rect class="box" x="370" y="404" width="220" height="86" rx="14"/>
    <text class="label" x="394" y="439">Postgres</text>
    <text class="sub" x="394" y="465">Lifecycle data</text>

    <rect class="box" x="620" y="404" width="210" height="86" rx="14"/>
    <text class="label" x="644" y="439">Object storage</text>
    <text class="sub" x="644" y="465">Logs and Site content</text>

    <rect class="box" x="950" y="110" width="260" height="86" rx="14"/>
    <text class="label" x="974" y="145">BuildKit or external CI</text>
    <text class="sub" x="974" y="171">Build application images</text>

    <rect class="box" x="950" y="248" width="260" height="86" rx="14"/>
    <text class="label" x="974" y="283">Kubernetes</text>
    <text class="sub" x="974" y="309">Run Environment workloads</text>

    <rect class="box" x="950" y="404" width="260" height="86" rx="14"/>
    <text class="label" x="974" y="439">Site gateway</text>
    <text class="sub" x="974" y="465">Serve published Site content</text>
  </g>

  <path class="line-muted" d="M 262 150 C 310 150, 326 150, 370 150"/>
  <path class="line-gold" d="M 262 290 C 308 290, 326 170, 370 158"/>
  <path class="line-muted" d="M 262 430 C 312 430, 326 188, 370 174"/>

  <path class="line-gold" d="M 590 153 L 620 153"/>
  <path class="line-gold" d="M 725 196 L 725 248"/>
  <path class="line-bidirectional" d="M 480 196 L 480 404"/>
  <path class="line-bidirectional" d="M 620 291 C 568 291, 558 404, 548 404"/>
  <path class="line-muted" d="M 725 334 L 725 404"/>

  <path class="line-gold" d="M 830 276 C 882 252, 900 153, 950 153"/>
  <path class="line-gold" d="M 830 291 L 950 291"/>
  <path class="line-muted" d="M 830 447 L 950 447"/>

  <path class="line-muted" d="M 1080 196 L 1080 606"/>
  <path class="line-muted" d="M 1110 334 L 1110 606"/>
  <path class="line-muted" d="M 1140 490 L 1140 606"/>
  <path class="line-muted" d="M 830 466 C 860 520, 900 570, 960 606"/>

  <rect x="320" y="614" width="930" height="76" rx="18" fill="#17150f" stroke="#f4d400" stroke-width="2"/>
  <text class="result-label" x="354" y="647">Result</text>
  <text class="result-sub" x="430" y="647">Environment status, logs, and URLs return to the UI, CLI, API, GitHub comments, and MCP clients.</text>
  <path class="line-gold" d="M 320 652 C 210 652, 160 580, 160 336"/>
</svg>
